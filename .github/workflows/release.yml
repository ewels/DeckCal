name: Release

on:
  release:
    types: [published]

# Defaults to read-only at the workflow level; the packaging job opts into
# `contents: write` only where it's actually needed (release-asset upload).
permissions:
  contents: read

# Two releases published in quick succession would otherwise race on the
# upload step. Serialize by release tag, no in-flight cancellation.
concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  package:
    name: Pack and attach .streamDeckPlugin
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # `gh release upload` writes the packed plugin asset to the release.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      - run: npm ci

      - name: Build
        # rollup substitutes the OAuth values into bin/plugin.js at build time.
        # Set these as repo secrets in GitHub → Settings → Secrets and variables.
        env:
          DECKCAL_GOOGLE_CLIENT_ID: ${{ secrets.DECKCAL_GOOGLE_CLIENT_ID }}
          DECKCAL_GOOGLE_CLIENT_SECRET: ${{ secrets.DECKCAL_GOOGLE_CLIENT_SECRET }}
        run: npm run build

      - name: Stage runtime deps inside the plugin folder
        # rollup keeps googleapis + google-auth-library (and their transitive
        # gaxios + gtoken) external. Write a package.json listing them so npm
        # pulls the deps alongside bin/plugin.js for `streamdeck pack`. The
        # rollup build also emits a package.json here (`{"type":"module"}`),
        # which this step overwrites with the full dep set.
        #
        # The version ranges are read straight out of the root package.json so
        # the packed plugin can never ship a different major than the one the
        # build and `tsc --noEmit` ran against.
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const externals = ["googleapis", "google-auth-library"];
            const root = JSON.parse(readFileSync("package.json", "utf8"));
            const dependencies = Object.fromEntries(
              externals.map((name) => {
                const range = root.dependencies?.[name];
                if (!range) {
                  throw new Error(`${name} is missing from root package.json dependencies`);
                }
                return [name, range];
              }),
            );
            writeFileSync(
              "com.ewels.deckcal.sdPlugin/package.json",
              `${JSON.stringify({ type: "module", private: true, dependencies }, null, 2)}\n`,
            );
          '
          cat com.ewels.deckcal.sdPlugin/package.json
          cd com.ewels.deckcal.sdPlugin
          npm install --omit=dev --no-package-lock --no-fund --no-audit

      - name: Pack
        run: npx --no-install streamdeck pack com.ewels.deckcal.sdPlugin --force

      - name: Attach .streamDeckPlugin to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" com.ewels.deckcal.streamDeckPlugin --clobber
