# Run with `prek run --all-files`. Install the git hook with `prek install`.
# Requires prek >= 0.4.0 (TOML config support).

[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v5.0.0"

[[repos.hooks]]
id = "trailing-whitespace"

[[repos.hooks]]
id = "end-of-file-fixer"

[[repos.hooks]]
id = "check-yaml"

[[repos.hooks]]
id = "check-json"
exclude = "^\\.vscode/"

[[repos.hooks]]
id = "check-merge-conflict"

[[repos.hooks]]
id = "mixed-line-ending"

[[repos.hooks]]
id = "check-added-large-files"

[[repos]]
repo = "https://github.com/rbubley/mirrors-prettier"
rev = "v3.4.2"

[[repos.hooks]]
id = "prettier"
types_or = ["json", "yaml", "markdown", "html", "css"]

[[repos]]
repo = "https://github.com/biomejs/pre-commit"
rev = "v2.2.0"

[[repos.hooks]]
id = "biome-check"
additional_dependencies = ["@biomejs/biome@2.4.15"]

# Type-check. Unlike biome and prettier this cannot run in a prek-managed
# environment: tsc needs the project's own node_modules to resolve @types/node
# and the .d.ts files shipped by @elgato/streamdeck, googleapis and
# google-auth-library. An isolated env holding only typescript would fail on
# every dependency import. So `language = "system"` and run `npm ci` first.
# typescript stays an npm devDependency regardless, because
# @rollup/plugin-typescript peer-depends on it to build the plugin.
[[repos]]
repo = "local"

[[repos.hooks]]
id = "tsc"
name = "tsc --noEmit"
entry = "npx tsc --noEmit"
language = "system"
files = "\\.tsx?$|(^|/)tsconfig[^/]*\\.json$"
# Must not pass filenames: tsc ignores tsconfig.json entirely when given
# explicit files, which would silently type-check with the wrong options.
pass_filenames = false
